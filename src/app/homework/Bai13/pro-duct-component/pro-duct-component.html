<p>pro-duct-component works!</p>
<table border="1">
    <thead>
        <tr>
            <td>Mã Sản Phẩm</td>
            <td>Tên Sản Phẩm</td>
            <td>Giá Sản Phẩm</td>
            <td>Hình ảnh</td>
            <td>#</td>
        </tr>
    </thead>
    <tbody>
        <tr *ngFor="let p of productWithImage">
            <td>{{p.ProductId}}</td>
            <td>{{p.ProductName}}</td>
            <td>{{p.Price}}</td>
            <td>
                <img src="{{p.Image}}" alt="{{p.ProductName}}" width="100" height="100">
            </td>
            <td>
                <a style="cursor: pointer;" title="Click here to view detail" (click)="viewDetail(p)">Details</a>
            </td>
        </tr>
    </tbody>
</table>
