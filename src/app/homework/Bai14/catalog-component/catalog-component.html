<table border="1">

    <tr>
        <td>Mã Danh Mục</td>
        <td>Tên Danh Mục</td>
    </tr>

    <ng-container *ngFor="let catalog of catalogs">

        <!-- CHỈ 1 DÒNG cho mỗi Catalog -->
        <tr>
            <td>{{ catalog.Cateid }}</td>
            <td>{{ catalog.CateName }}</td>
        </tr>

        <!-- Bảng sản phẩm -->
        <tr>
            <td colspan="2">

                <table border="1">
                    <tr>
                        <td>Mã Sản Phẩm</td>
                        <td>Tên Sản Phẩm</td>
                        <td>Giá Sản Phẩm</td>
                        <td>Picture</td>
                    </tr>

                    <tr *ngFor="let product of catalog.Products">
                        <td>{{ product.ProductId }}</td>
                        <td>{{ product.ProductName }}</td>
                        <td>{{ product.Price }}</td>
                        <td>
                            <img src="{{ product.Image }}"
                                 width="70"
                                 height="70">
                        </td>
                    </tr>

                </table>

            </td>
        </tr>

    </ng-container>

</table>
