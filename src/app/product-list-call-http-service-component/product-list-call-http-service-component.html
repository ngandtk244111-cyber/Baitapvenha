<p>product-list-call-http-service-component works!</p>

<table border="1">
  <thead>
    <tr>
      <th>STT</th>
      <th>ID</th>
      <th>Name</th>
      <th>Price</th>
      <th>Image</th>
    </tr>
  </thead>
  <tbody>
    @for (p of products(); track p.id; let i = $index) {
      <tr>
        <td>{{ i + 1 }}</td>
        <td>{{ p.id }}</td>
        <td>{{ p.name }}</td>
        <td>{{ p.price }}</td>
        <td><img [src]="p.image" width="100" height="100"></td>
      </tr>
    }
    @empty {
      <tr>
        <td colspan="4">not Found Product</td>
      </tr>
    }
  </tbody>
</table>
